# Renderiza vídeos do molde em paralelo nas máquinas Linux do GitHub (até 20 ao mesmo tempo no plano Free). Máquina padrão:
# repositório público 4 vCPU / 16 GB e minutos livres; privado 2 vCPU / 8 GB e ~2.000 min/mês.
# Disparo só manual: sh molde/nuvem.sh (de um clone), ou Actions > render > Run workflow no site.
# Saída: artifact "videos" já no formato de VIDEOS PRONTOS/ (Informativos/, Falando de <Carro>/), artifacts "dados-<nome>"
# (srt, cena.json, folha, poster, log) e um commit com os cena.json novos. Tudo expira em 1 dia; molde/baixar.sh traz e apaga.
name: render
run-name: render ${{ inputs.pastas || 'fila' }}

on:
  workflow_dispatch:
    inputs:
      pastas:
        description: 'Vídeos separados por vírgula, no formato do fila.txt ("roteiros/02-luzes-cores blueprint, serie-falando-de/carros/gol/parte-03"). Vazio = linhas do molde/fila.txt; "todas" = toda pasta de roteiro com lines.json (sem fila, estilo padrão). Nos dois, pula quem já tem molde/saida/<nome>/cena.json no repositório.'
        required: false
        default: ''
      lote:
        description: 'Quantos vídeos da fila (ou de "todas") entram neste lote (máximo 20)'
        required: false
        default: '5'

concurrency:   # um lote por vez; o próximo espera na fila
  group: render
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIB_SHA: 143f387ad774525dc9abc0ff05fb5f4bfbaa5f02   # versão da biblioteca no notebook: git -C ~/lemo-opuscar rev-parse HEAD
  CACHE_KEY: lemo-143f387ad774525dc9abc0ff05fb5f4bfbaa5f02-v1   # troque junto com o LIB_SHA

jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v5
      - id: lista
        name: lista do lote
        shell: bash
        env:
          PASTAS: ${{ inputs.pastas }}
          LOTE: ${{ inputs.lote }}
        run: |
          N=20
          case "$PASTAS" in
            '') grep -vE '^[[:space:]]*(#|$)' molde/fila.txt; N=$LOTE ;;
            todas) ls roteiros/*/lines.json serie-falando-de/carros/*/parte-*/lines.json | sed 's,/lines.json$,,'; N=$LOTE ;;
            *) printf '%s\n' "$PASTAS" | tr ',;' '\n\n' ;;
          esac > pedidos.txt
          [ "$N" -le 20 ] 2>/dev/null || N=20
          tr -d '\r' < pedidos.txt | while read -r pasta estilo; do
            [ -n "$pasta" ] || continue
            [ -f "$pasta/lines.json" ] || { echo "::error::não achei $pasta/lines.json"; exit 1; }
            b=$(basename "$pasta"); case "$b" in parte-*) b="$(basename "$(dirname "$pasta")")-$b" ;; esac
            nome=$b; [ -n "$estilo" ] && [ "$estilo" != hologram-hud ] && nome=$b-$estilo
            # fila: pula quem já tem cena.json no repositório; todas: idem, em qualquer estilo
            if [ "$PASTAS" = todas ]; then
              if compgen -G "molde/saida/$b" > /dev/null || compgen -G "molde/saida/$b-*" > /dev/null; then continue; fi
            elif [ -z "$PASTAS" ] && [ -f "molde/saida/$nome/cena.json" ]; then continue; fi
            jq -nc --arg p "$pasta" --arg e "$estilo" --arg n "$nome" '{pasta: $p, estilo: $e, nome: $n}'
          done | jq -sc . > lista.json
          n=$(jq length lista.json)
          [ "$n" -le "$N" ] || echo "::notice::$n vídeos pendentes; este lote leva $N"
          echo "lista=$(jq -c ".[:$N]" lista.json)" >> "$GITHUB_OUTPUT"
          jq -r ".[:$N][] | \"\(.nome)  <-  \(.pasta) \(.estilo)\"" lista.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/lemo-opuscar
            ~/.cache/ms-playwright
            ~/ffmpeg
          key: ${{ env.CACHE_KEY }}
      - name: instalar (só quando o cache falta)
        run: sh .github/instalar.sh

  render:
    needs: preparar
    if: needs.preparar.outputs.lista != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        v: ${{ fromJSON(needs.preparar.outputs.lista) }}
    name: ${{ matrix.v.nome }}
    env:
      NOME: ${{ matrix.v.nome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/lemo-opuscar
            ~/.cache/ms-playwright
            ~/ffmpeg
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - name: conferir instalação
        run: sh .github/instalar.sh
      - name: build
        env:
          ESTILO: ${{ matrix.v.estilo }}
          PASTA: ${{ matrix.v.pasta }}
        run: WORKERS=$(nproc) sh molde/build.sh "$PASTA"   # um navegador por vCPU (4 no público, 2 no privado)
      - name: vídeo no caminho de VIDEOS PRONTOS (e nunca abaixo de 70 s)
        run: |
          F="molde/saida/$NOME/$NOME.mp4"; M=${DURACAO_MIN:-70}
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")
          awk -v d="$d" -v m="$M" 'BEGIN { exit !(d >= m) }' || { echo "::error::$NOME tem $d s, abaixo do mínimo de $M s"; exit 1; }
          echo "duração: $d s"
          A=$(python3 molde/prontos.py --destino "$NOME")
          mkdir -p "entrega/$(dirname "$A")" && mv "molde/saida/$NOME/$NOME.mp4" "entrega/$A" && echo "$A"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.v.nome }}
          path: entrega/
          retention-days: 1
          compression-level: 0   # mp4 já é comprimido
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dados-${{ matrix.v.nome }}
          path: |
            molde/saida/${{ matrix.v.nome }}/${{ matrix.v.nome }}.srt
            molde/saida/${{ matrix.v.nome }}/cena.json
            molde/saida/${{ matrix.v.nome }}/folha.jpg
            molde/saida/${{ matrix.v.nome }}/poster.jpg
            molde/saida/${{ matrix.v.nome }}/build.log
            molde/saida/${{ matrix.v.nome }}/out/checagem.txt
          retention-days: 1
          if-no-files-found: error

  juntar:
    needs: render
    if: ${{ !cancelled() && needs.render.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # commit dos cena.json novos
    steps:
      - name: um artifact "videos" com todos os vídeos do lote
        uses: actions/upload-artifact/merge@v4
        with:
          name: videos
          pattern: video-*
          delete-merged: true
          retention-days: 1
          compression-level: 0
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dados-*
          path: dados
      - name: guardar no repositório os cena.json novos ou completados (rascunho automático, a revisar)
        run: |
          for d in dados/dados-*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d"); n=${n#dados-}; f=molde/saida/$n/cena.json
            # mudou no repositório durante o lote? fica a versão de lá (o rascunho só completa falas; não desfaz revisão)
            if [ -f "$f" ] && ! git diff --quiet "$GITHUB_SHA" -- "$f"; then echo "pulei $f: mudou durante o lote"; continue; fi
            mkdir -p "molde/saida/$n"; cp "$d/cena.json" "$f"
          done
          git add molde/saida/*/cena.json
          git diff --cached --quiet && { echo "nenhum cena.json novo"; exit 0; }
          # identidade no config (não só no commit): o pull --rebase também reescreve o commit
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "cena.json do lote ${{ github.run_id }} (rascunho automático: revisar)"
          git diff --stat HEAD~1
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1
